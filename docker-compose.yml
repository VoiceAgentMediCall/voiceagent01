# MediCall AI — full local stack.
#
# Usage:
#   1. Fill in .env (repo root, shared Supabase/LiveKit/Groq credentials) and each
#      service's own file (livekit/.env, dashboard/.env.local, eval-runner/.env) —
#      see CLAUDE.md § Environment variables. evals/ has no .env of its own; it's
#      pointed at the root file via `--env-path` when run directly.
#   2. NEXT_PUBLIC_* vars must be in the shell environment at BUILD time (Next.js
#      inlines them into the client bundle during `next build`, not at container
#      start) — env_file alone won't reach the build step. Compose auto-loads the
#      root .env for ${...} substitution below, so NEXT_PUBLIC_SUPABASE_URL is
#      already covered; the two dashboard-only public vars still need exporting:
#        export $(grep -E '^NEXT_PUBLIC' dashboard/.env.local | xargs)
#   3. docker compose up --build
#
# Dashboard  -> http://localhost:3000
# eval-runner health check -> http://localhost:3001/health
# livekit-agent has no exposed port — it makes outbound connections to
# LiveKit Cloud only, nothing needs to reach it from outside.
#
# Clashes with `npm run dev` on :3000 — cp docker-compose.override.yml.example
# docker-compose.override.yml to remap host ports.

services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # `:-` silences the warning on ps/logs/down. Step 2's export is still
        # required for real builds — unset here bakes empty strings.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED:-false}
    env_file:
      - .env
      - dashboard/.env.local
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      # /login, not /: the rest redirect through Supabase auth.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  eval-runner:
    build:
      context: .
      dockerfile: eval-runner/Dockerfile
    env_file:
      - .env
      - eval-runner/.env
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  livekit-agent:
    build:
      context: .
      dockerfile: livekit/Dockerfile
    env_file:
      - .env
      - livekit/.env
    restart: unless-stopped
    healthcheck:
      # livekit-agents' worker health endpoint; container-internal only.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/',timeout=3)\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
